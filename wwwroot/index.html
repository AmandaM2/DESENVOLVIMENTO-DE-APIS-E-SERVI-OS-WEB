<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Meu Banco Digital</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="loginScreen" class="card">
            <h2>Acesso à Conta</h2>
            <input
                type="text"
                id="loginUsuario"
                placeholder="Titular da Conta"
            />
            <input type="password" id="loginSenha" placeholder="Senha" />
            <button onclick="fazerLogin()">Entrar</button>
            <div id="loginMensagem" class="erro"></div>
            <div class="link-alternativo" onclick="mudarTela('cadastroScreen')">
                Não tem conta? Cadastre-se
            </div>
        </div>

        <div id="cadastroScreen" class="card">
            <h2>Criar Conta Bancária</h2>
            <input type="text" id="cadUsuario" placeholder="Nome de Usuário" />
            <input
                type="password"
                id="cadSenha"
                placeholder="Escolha uma Senha"
            />
            <button class="btn-depositar" onclick="fazerCadastro()">
                Cadastrar
            </button>
            <div id="cadastroMensagem"></div>
            <div class="link-alternativo" onclick="mudarTela('loginScreen')">
                Voltar para o Login
            </div>
        </div>

        <div id="dashboard" class="card">
            <h2>Olá, <span id="nomeUsuario">Usuário</span>!</h2>
            <h3>Saldo: R$ <span id="saldoAtual">0.00</span></h3>

            <input
                type="number"
                id="valorTransacao"
                placeholder="Valor (R$)"
                min="0.01"
                step="0.01"
            />

            <button class="btn-sacar" onclick="realizarTransacao('sacar')">
                Sacar
            </button>
            <button
                class="btn-depositar"
                onclick="realizarTransacao('depositar')"
            >
                Depositar
            </button>

            <div id="transacaoMensagem"></div>

            <button class="btn-logout" onclick="logout()">Sair da Conta</button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
